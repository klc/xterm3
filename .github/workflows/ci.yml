name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.channel == 'master' }}

    strategy:
      matrix:
        os: [macos-latest]
        channel: [stable, master]
        include:
          # Flutter 3.50.0 deprecates `package:flutter/material.dart` and
          # `package:flutter/cupertino.dart` in favour of `material_ui` and
          # `cupertino_ui`, and `--fatal-infos` turns each import into a
          # failure. Pinned to the last stable release that analyses clean
          # until the package moves to those imports; drop this entry then.
          - channel: stable
            flutter-version: 3.47.9

    steps:
      - uses: actions/checkout@v4

      # - uses: actions/setup-java@v1
      #   with:
      #     java-version: "12.x"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.flutter-version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
